# Tomcat
server:
  port: 8080

# Spring
spring:
  application:
    # 应用名称
    name: spzx-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 192.168.6.100:8848
        namespace: 427cfad1-0eaf-4721-bced-fd920c3767db
        group: DEFAULT_GROUP
      config:
        # 配置中心地址
        server-addr: 192.168.6.100:8848
        namespace: 427cfad1-0eaf-4721-bced-fd920c3767db
        group: DEFAULT_GROUP
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 192.168.6.100:8858
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: 192.168.6.100:8848
            namespace: 427cfad1-0eaf-4721-bced-fd920c3767db
            dataId: sentinel-spzx-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow

  main:
    web-application-type: reactive
